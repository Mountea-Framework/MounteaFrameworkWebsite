site_name: Mountea Blog
site_url: https://mountea.tools/blog
docs_dir: blog_src
site_dir: blog
theme:
  name: material
  favicon: ../assets/icon.png
  logo: ../assets/icon.png
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.integrate
    - content.code.copy

nav:
  - Home: index.md
  - Articles:
      - First Post: post-1.md
      - Second Post: post-2.md
  - Tags: tags.md

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/extra.js

plugins:
  - tags
  - search
  - meta

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 2