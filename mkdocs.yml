site_name: Mountea Framework Docs
site_url: https://mountea.tools/docs/
docs_dir: docs_src
site_dir: docs

theme:
  name: material
  custom_dir: overrides
  favicon: ../assets/icon.png
  logo: ../assets/icon.png
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.integrate
    - content.code.copy
    - mermaid

nav:
  - Home: index.md
  - Projects:
